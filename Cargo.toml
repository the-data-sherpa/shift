[workspace]
resolver = "3"
members = ["crates/shift-core", "crates/shift-app"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
shift-core = { path = "crates/shift-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
thiserror = "2"
gpui-kit = "0.9.1"
