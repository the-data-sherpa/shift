[workspace]
resolver = "3"
members = ["crates/shift-core", "crates/shift-adapter-claude", "crates/shift-app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/the-data-sherpa/shift"

[workspace.dependencies]
shift-core = { path = "crates/shift-core" }
shift-adapter-claude = { path = "crates/shift-adapter-claude" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
async-channel = "2"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
gpui-kit = "0.9.1"
